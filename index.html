<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PRODUCTION SYSTEM</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts: Prompt -->
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- html2canvas สำหรับเซฟหน้าสรุปผลเป็นรูปภาพ -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Prompt', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #F8FAFC;
            color: #0F172A;
            font-family: 'Prompt', sans-serif;
        }
        .white-panel {
            background: #FFFFFF;
            border: 1px solid #E2E8F0;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
        }
        .custom-input {
            background-color: #F8FAFC;
            border: 1px solid #CBD5E1;
            color: #0F172A;
            transition: all 0.2s ease;
        }
        .custom-input:focus {
            border-color: #0284C7;
            background-color: #FFFFFF;
            box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.15);
            outline: none;
        }
    </style>
</head>
<body class="min-h-screen pb-12">

    <!-- Header Section -->
    <header class="bg-white border-b border-slate-200 sticky top-0 z-40 mb-8 shadow-sm">
        <div class="max-w-7xl mx-auto px-4 py-4 flex flex-col md:flex-row justify-between items-center gap-4">
            <div class="flex items-center space-x-3 cursor-pointer" onclick="showPage('homePage')">
                <div class="p-2 bg-sky-50 rounded-lg border border-sky-100">
                    <i class="fa-solid fa-microchip text-sky-600 text-2xl"></i>
                </div>
                <h1 class="text-2xl font-bold tracking-wider text-slate-800">
                    PRODUCTION SYSTEM
                </h1>
            </div>
            
            <nav class="flex flex-wrap gap-2 md:gap-3">
                <button onclick="showPage('leavePage')" class="px-4 py-2 text-sm font-medium rounded-xl bg-sky-600 hover:bg-sky-700 text-white shadow-md shadow-sky-600/20 transition-all flex items-center gap-2">
                    <i class="fa-solid fa-user-clock"></i> ส่งข้อมูลพนักงานหยุด-ลาประจำวัน
                </button>
            </nav>
        </div>
    </header>

    <main class="max-w-5xl mx-auto px-4">
        
        <!-- HOME PAGE -->
        <div id="homePage" class="space-y-6">
            <div class="white-panel p-8 rounded-2xl text-center space-y-4 border border-slate-200 shadow-sm">
                <div class="inline-block p-4 bg-sky-50 rounded-full border border-sky-100 mb-2">
                    <i class="fa-solid fa-industry text-5xl text-sky-600"></i>
                </div>
                <h2 class="text-3xl font-bold text-slate-800">ระบบรายงานสถานะพนักงานประจำวัน</h2>
                <p class="text-slate-500 max-w-xl mx-auto">Created by Pattrawadee Srisawat</p>
                <div class="pt-6 flex justify-center gap-4">
                    <button onclick="showPage('leavePage')" class="px-6 py-3 rounded-xl bg-sky-600 hover:bg-sky-700 text-white font-semibold transition-all shadow-md shadow-sky-600/20 flex items-center gap-2">
                        <i class="fa-solid fa-plus-circle"></i> เริ่มลงข้อมูลพนักงานหยุด-ลา
                    </button>
                </div>
            </div>
        </div>

        <!-- FORM PAGE -->
        <div id="leavePage" class="hidden space-y-6">
            <form id="leaveForm" onsubmit="event.preventDefault(); openSummaryModal();" class="space-y-6">
                
                <!-- Section 0: ผู้บันทึกข้อมูล -->
                <div class="white-panel p-6 rounded-2xl space-y-4">
                    <h3 class="text-lg font-semibold text-sky-700 flex items-center gap-2 border-b border-slate-100 pb-3">
                        <i class="fa-solid fa-id-card"></i> ข้อมูลผู้ลงบันทึก
                    </h3>
                    <div class="max-w-md">
                        <label class="block text-xs font-medium text-slate-600 mb-1">ชื่อ-นามสกุล (ผู้บันทึก) <span class="text-rose-500">*</span></label>
                        <input type="text" id="recorderName" required placeholder="ระบุชื่อผู้ลงข้อมูล" class="w-full custom-input px-3 py-2.5 rounded-xl text-sm">
                    </div>
                </div>

                <!-- Section 1: ข้อมูลพื้นฐาน -->
                <div class="white-panel p-6 rounded-2xl space-y-4">
                    <h3 class="text-lg font-semibold text-sky-700 flex items-center gap-2 border-b border-slate-100 pb-3">
                        <i class="fa-regular fa-calendar-check"></i> 1. ข้อมูลสายการผลิตและวันที่
                    </h3>
                    
                    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">
                        <div>
                            <label class="block text-xs font-medium text-slate-600 mb-1">วันที่ประจำวัน <span class="text-rose-500">*</span></label>
                            <input type="date" id="reportDate" required class="w-full custom-input px-3 py-2.5 rounded-xl text-sm">
                        </div>

                        <div>
                            <label class="block text-xs font-medium text-slate-600 mb-1">แผนก <span class="text-rose-500">*</span></label>
                            <select id="department" onchange="handleDepartmentChange()" required class="w-full custom-input px-3 py-2.5 rounded-xl text-sm">
                                <option value="">-- เลือกแผนก --</option>
                                <option value="Pre Ass’y">Pre Ass’y</option>
                                <option value="Main Ass’y">Main Ass’y</option>
                                <option value="QA">QA</option>
                                <option value="RM/FS">RM/FS</option>
                                <option value="ENG">ENG</option>
                                <option value="EDU">EDU</option>
                            </select>
                        </div>

                        <div>
                            <label class="block text-xs font-medium text-slate-600 mb-1">Maker <span class="text-rose-500">*</span></label>
                            <select id="maker" onchange="handleMakerShiftChange()" required class="w-full custom-input px-3 py-2.5 rounded-xl text-sm">
                                <option value="">-- เลือก Maker --</option>
                                <option value="All">All</option>
                                <option value="Isuzu">Isuzu</option>
                                <option value="Nissan">Nissan</option>
                                <option value="Toyota">Toyota</option>
                            </select>
                        </div>

                        <div>
                            <label class="block text-xs font-medium text-slate-600 mb-1">กะ (Shift) <span class="text-rose-500">*</span></label>
                            <select id="shift" onchange="handleMakerShiftChange()" required class="w-full custom-input px-3 py-2.5 rounded-xl text-sm">
                                <option value="">-- เลือกกะ --</option>
                                <option value="เช้าตลอด">เช้าตลอด</option>
                                <option value="A">กะ A</option>
                                <option value="B">กะ B</option>
                            </select>
                        </div>
                    </div>

                    <div id="lineSelectionContainer" class="pt-2"></div>
                </div>

                <!-- Section 2: ข้อมูลจำนวนคน -->
                <div class="white-panel p-6 rounded-2xl space-y-4">
                    <h3 class="text-lg font-semibold text-sky-700 flex items-center gap-2 border-b border-slate-100 pb-3">
                        <i class="fa-solid fa-users-gear"></i> 2. จำนวนคน (Manpower)
                    </h3>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs font-medium text-slate-600 mb-1">ตัว SET (คน)</label>
                            <input type="number" id="setTarget" min="0" placeholder="0" class="w-full custom-input px-3 py-2.5 rounded-xl text-sm">
                        </div>
                        <div>
                            <label class="block text-xs font-medium text-slate-600 mb-1">ขาดตัว SET (คน)</label>
                            <input type="number" id="setMissing" min="0" placeholder="0" class="w-full custom-input px-3 py-2.5 rounded-xl text-sm">
                        </div>
                    </div>
                </div>

                <!-- Section 3: รายชื่อพนักงานหยุด-ลา -->
                <div class="white-panel p-6 rounded-2xl space-y-4">
                    <div class="flex justify-between items-center border-b border-slate-100 pb-3">
                        <h3 class="text-lg font-semibold text-sky-700 flex items-center gap-2">
                            <i class="fa-solid fa-user-minus"></i> 3. พนักงานหยุด-ลา 
                            <span class="text-xs font-normal text-slate-600 bg-slate-100 px-2.5 py-1 rounded-md border border-slate-200">
                                รวม: <span id="totalLeaveCount" class="text-sky-600 font-bold">0</span> คน
                            </span>
                        </h3>
                        <button type="button" onclick="addLeaveRow()" class="px-3 py-1.5 text-xs font-semibold rounded-lg bg-emerald-50 hover:bg-emerald-100 text-emerald-700 border border-emerald-200 flex items-center gap-1 transition-all">
                            <i class="fa-solid fa-plus"></i> เพิ่มรายชื่อ
                        </button>
                    </div>

                    <div id="leaveListContainer" class="space-y-3"></div>
                </div>

                <!-- Section 4: รายชื่อพนักงานปลด-ลาออก -->
                <div class="white-panel p-6 rounded-2xl space-y-4">
                    <div class="flex justify-between items-center border-b border-slate-100 pb-3">
                        <h3 class="text-lg font-semibold text-rose-600 flex items-center gap-2">
                            <i class="fa-solid fa-user-xmark"></i> 4. พนักงานปลด-ลาออก
                            <span class="text-xs font-normal text-slate-600 bg-slate-100 px-2.5 py-1 rounded-md border border-slate-200">
                                รวม: <span id="totalResignCount" class="text-rose-600 font-bold">0</span> คน
                            </span>
                        </h3>
                        <button type="button" onclick="addResignRow()" class="px-3 py-1.5 text-xs font-semibold rounded-lg bg-emerald-50 hover:bg-emerald-100 text-emerald-700 border border-emerald-200 flex items-center gap-1 transition-all">
                            <i class="fa-solid fa-plus"></i> เพิ่มรายชื่อ
                        </button>
                    </div>

                    <div id="resignListContainer" class="space-y-3"></div>

                    <div class="pt-4 border-t border-slate-100">
                        <label class="block text-xs font-medium text-slate-600 mb-1">หมายเหตุเพิ่มเติม</label>
                        <textarea id="remark" rows="3" placeholder="ระบุรายละเอียดเพิ่มเติม (ถ้ามี)" class="w-full custom-input p-3 rounded-xl text-sm resize-none"></textarea>
                    </div>
                </div>

                <div class="flex justify-end pt-4">
                    <button type="submit" class="w-full md:w-auto px-8 py-3 rounded-xl bg-sky-600 hover:bg-sky-700 text-white font-semibold shadow-lg shadow-sky-600/20 transition-all">
                        ถัดไป (ตรวจสอบข้อมูล) <i class="fa-solid fa-arrow-right ml-2"></i>
                    </button>
                </div>
            </form>
        </div>

    </main>

    <!-- Floating Exit Button -->
    <div class="fixed bottom-6 right-6 z-30">
        <button onclick="showPage('homePage')" class="px-4 py-2.5 rounded-full bg-white hover:bg-slate-50 text-rose-600 border border-slate-200 shadow-xl backdrop-blur-md transition-all flex items-center gap-2 text-sm font-semibold hover:scale-105">
            <i class="fa-solid fa-right-from-bracket"></i> EXIT
        </button>
    </div>

    <!-- SUMMARY POPUP MODAL -->
    <div id="summaryModal" class="fixed inset-0 z-50 hidden bg-slate-900/40 backdrop-blur-sm flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-2xl max-h-[90vh] rounded-2xl border border-slate-200 shadow-2xl flex flex-col overflow-hidden">
            
            <div class="p-5 border-b border-slate-100 flex justify-between items-center bg-slate-50">
                <h3 class="text-lg font-bold text-slate-800 flex items-center gap-2">
                    <i class="fa-solid fa-clipboard-check text-sky-600"></i> สรุปผลข้อมูลก่อนส่ง
                </h3>
                <button onclick="closeSummaryModal()" class="text-slate-400 hover:text-slate-600 transition-colors">
                    <i class="fa-solid fa-xmark text-xl"></i>
                </button>
            </div>

            <!-- กล่องสรุปผลที่จะโดนจับภาพเป็นรูปภาพ -->
            <div id="summaryCaptureArea" class="p-6 overflow-y-auto space-y-4 text-sm text-slate-700 bg-white">
                <div id="summaryContent" class="space-y-4"></div>
            </div>

            <!-- แถบปุ่มกดด้านล่าง -->
            <div class="p-4 border-t border-slate-100 bg-slate-50 flex flex-wrap justify-between items-center gap-3">
                <!-- ปุ่มบันทึกภาพ -->
                <button type="button" onclick="downloadSummaryImage()" class="px-4 py-2.5 rounded-xl bg-purple-600 hover:bg-purple-700 text-white text-sm font-medium transition-all flex items-center gap-2 shadow-md shadow-purple-600/20">
                    <i class="fa-solid fa-file-image"></i> เซฟเป็นรูปภาพ
                </button>

                <div class="flex gap-3 ml-auto">
                    <button type="button" onclick="closeSummaryModal()" class="px-4 py-2.5 rounded-xl bg-slate-200 hover:bg-slate-300 text-slate-700 text-sm font-medium transition-all">
                        <i class="fa-solid fa-pen-to-square mr-1"></i> แก้ไขข้อมูล
                    </button>
                    <button type="button" id="submitBtn" onclick="confirmSubmit()" class="px-6 py-2.5 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white text-sm font-semibold shadow-md shadow-emerald-600/20 transition-all flex items-center gap-2">
                        <i class="fa-solid fa-paper-plane"></i> ยืนยันการส่งข้อมูล
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- JavaScript Logic -->
    <script>
        // ⚠️ วาง URL ของ Google Apps Script ของคุณตรงนี้
        const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwvdsZcgC4RWTVRCv_bC14HAFLvphh1zgV4mnrjtdatkugPPkiKXQ0Yk_eSpO7j3-9TrQ/exec";

        let employeeDatabase = {}; 

        const MAIN_ASSY_DUTIES = [
            'SUB ASS’Y', 'SUB BOARD', 'WIRE LAYOUT', 'TAPING', 'PART ASS’Y', 
            'CLIP ASS’Y', 'SILICONE', 'CLIP OFF LINE/CHECK CLIP/INS.1', 
            'CHECKER', 'INS.2/Q-GATE', 'FINISHING', 'DI/AQA', 'PACKING'
        ];

        const LEAVE_TYPES = ['ลากิจ', 'ลาป่วย', 'ลาพักร้อน', 'ขาดงาน'];
        const RESIGN_TYPES = ['ลาออก', 'ปลด']; // เพิ่มประเภทปลด-ลาออก

        const LINES = {
            Isuzu: ['DI-1', 'DI-2', 'DI-3', 'DI-4', 'DI-5', 'DI-6'],
            Nissan: ['DN-10', 'DN-18'],
            Toyota: ['DT-1', 'DT-2', 'DT-3', 'DT-4', 'DT-5', 'DT-6', 'DT-8', 'DT-9', 'DT-10', 'DT-11', 'DT-13', 'DT-16', 'DT-17']
        };

        // ดึงข้อมูลพนักงานจาก Sheet อัตโนมัติเมื่อเปิดเว็บ
        document.addEventListener('DOMContentLoaded', async () => {
            document.getElementById('reportDate').valueAsDate = new Date();
            
            try {
                const response = await fetch(GOOGLE_SCRIPT_URL);
                employeeDatabase = await response.json();
                console.log("โหลดข้อมูลพนักงานสำเร็จ:", employeeDatabase);
            } catch (err) {
                console.error("ไม่สามารถดึงข้อมูลพนักงานได้:", err);
            }
        });

        // ดึงชื่อพนักงานตามรหัสที่กรอก
        function autoFillName(inputEl, targetNameId) {
            const empId = inputEl.value.trim();
            const nameDisplayEl = document.getElementById(targetNameId);
            
            if (employeeDatabase[empId]) {
                nameDisplayEl.value = employeeDatabase[empId];
                nameDisplayEl.classList.remove('text-rose-500');
                nameDisplayEl.classList.add('text-emerald-600');
            } else if (empId !== '') {
                nameDisplayEl.value = "❌ ไม่พบรหัสพนักงาน";
                nameDisplayEl.classList.remove('text-emerald-600');
                nameDisplayEl.classList.add('text-rose-500');
            } else {
                nameDisplayEl.value = "";
            }
        }

        function showPage(pageId) {
            document.getElementById('homePage').classList.add('hidden');
            document.getElementById('leavePage').classList.add('hidden');
            document.getElementById(pageId).classList.remove('hidden');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function handleDepartmentChange() {
            renderLineSelection();
            refreshRowsUI();
        }

        function handleMakerShiftChange() {
            renderLineSelection();
        }

        function renderLineSelection() {
            const dept = document.getElementById('department').value;
            const maker = document.getElementById('maker').value;
            const shift = document.getElementById('shift').value;
            const container = document.getElementById('lineSelectionContainer');

            container.innerHTML = '';
            if (!dept || !maker || !shift) return;

            if (dept === 'Pre Ass’y' && (maker === 'Isuzu' || maker === 'Nissan')) {
                container.innerHTML = `
                    <div>
                        <label class="block text-xs font-medium text-slate-600 mb-1">ระบุ Line (Pre Ass’y - ${maker}) <span class="text-rose-500">*</span></label>
                        <input type="text" id="lineInput" required placeholder="กรอกชื่อ Line เช่น Line 1" class="w-full custom-input px-3 py-2.5 rounded-xl text-sm">
                    </div>
                `;
            } else if (dept === 'Main Ass’y') {
                let options = LINES[maker] || [];
                if (options.length > 0) {
                    const optsHTML = options.map(l => `<option value="${l}">${l}</option>`).join('');
                    container.innerHTML = `
                        <div>
                            <label class="block text-xs font-medium text-slate-600 mb-1">เลือก Line (Main Ass’y - ${maker}) <span class="text-rose-500">*</span></label>
                            <select id="lineSelect" required class="w-full custom-input px-3 py-2.5 rounded-xl text-sm">
                                <option value="">-- เลือก Line --</option>
                                ${optsHTML}
                            </select>
                        </div>
                    `;
                }
            }
        }

        function refreshRowsUI() {
            document.querySelectorAll('.leave-row').forEach(row => updateDutyDropdown(row, 'leave'));
            document.querySelectorAll('.resign-row').forEach(row => updateDutyDropdown(row, 'resign'));
        }

        function updateDutyDropdown(row, type) {
            const dept = document.getElementById('department').value;
            const dutyContainer = row.querySelector('.duty-container');
            
            if (dept === 'Main Ass’y') {
                const optsHTML = MAIN_ASSY_DUTIES.map(d => `<option value="${d}">${d}</option>`).join('');
                dutyContainer.innerHTML = `
                    <select name="${type}Duty" required class="w-full custom-input px-3 py-2 rounded-xl text-xs">
                        <option value="">-- เลือกหน้าที่ --</option>
                        ${optsHTML}
                    </select>
                `;
                dutyContainer.classList.remove('hidden');
            } else {
                dutyContainer.innerHTML = '';
                dutyContainer.classList.add('hidden');
            }
        }

        function addLeaveRow() {
            const container = document.getElementById('leaveListContainer');
            const timestamp = Date.now();
            const rowId = 'leave_' + timestamp;
            const nameDisplayId = 'empName_' + timestamp;
            const row = document.createElement('div');
            row.className = 'leave-row grid grid-cols-1 md:grid-cols-12 gap-2 items-center bg-slate-50 p-3 rounded-xl border border-slate-200';
            row.id = rowId;

            const leaveOptsHTML = LEAVE_TYPES.map(t => `<option value="${t}">${t}</option>`).join('');

            row.innerHTML = `
                <div class="md:col-span-2">
                    <input type="text" name="leaveEmpId" required placeholder="รหัสพนักงาน" 
                           oninput="autoFillName(this, '${nameDisplayId}')" 
                           class="w-full custom-input px-3 py-2 rounded-xl text-xs uppercase">
                </div>
                <div class="md:col-span-3">
                    <input type="text" id="${nameDisplayId}" name="leaveName" readonly placeholder="ชื่อ-นามสกุล (อัตโนมัติ)" 
                           class="w-full bg-slate-100 border border-slate-200 text-slate-700 px-3 py-2 rounded-xl text-xs font-medium">
                </div>
                <div class="duty-container md:col-span-3 hidden"></div>
                <div class="leave-type-container md:col-span-3">
                    <select name="leaveType" required class="w-full custom-input px-3 py-2 rounded-xl text-xs">
                        <option value="">-- ประเภทการลา --</option>
                        ${leaveOptsHTML}
                    </select>
                </div>
                <div class="md:col-span-1 flex justify-end">
                    <button type="button" onclick="removeRow('${rowId}')" class="p-2 text-slate-400 hover:text-rose-600 transition-colors">
                        <i class="fa-solid fa-trash"></i>
                    </button>
                </div>
            `;

            container.appendChild(row);
            updateDutyDropdown(row, 'leave');
            updateCounts();
        }

        // เพิ่ม Dropdown ประเภท (ปลด / ลาออก) ในแถวพนักงานปลด-ลาออก
        function addResignRow() {
            const container = document.getElementById('resignListContainer');
            const timestamp = Date.now();
            const rowId = 'resign_' + timestamp;
            const nameDisplayId = 'resignEmpName_' + timestamp;
            const row = document.createElement('div');
            row.className = 'resign-row grid grid-cols-1 md:grid-cols-12 gap-2 items-center bg-slate-50 p-3 rounded-xl border border-slate-200';
            row.id = rowId;

            const resignOptsHTML = RESIGN_TYPES.map(t => `<option value="${t}">${t}</option>`).join('');

            row.innerHTML = `
                <div class="md:col-span-2">
                    <input type="text" name="resignEmpId" required placeholder="รหัสพนักงาน" 
                           oninput="autoFillName(this, '${nameDisplayId}')" 
                           class="w-full custom-input px-3 py-2 rounded-xl text-xs uppercase">
                </div>
                <div class="md:col-span-3">
                    <input type="text" id="${nameDisplayId}" name="resignName" readonly placeholder="ชื่อ-นามสกุล (อัตโนมัติ)" 
                           class="w-full bg-slate-100 border border-slate-200 text-slate-700 px-3 py-2 rounded-xl text-xs font-medium">
                </div>
                <div class="duty-container md:col-span-3 hidden"></div>
                <div class="resign-type-container md:col-span-3">
                    <select name="resignType" required class="w-full custom-input px-3 py-2 rounded-xl text-xs">
                        <option value="">-- ปลด / ลาออก --</option>
                        ${resignOptsHTML}
                    </select>
                </div>
                <div class="md:col-span-1 flex justify-end">
                    <button type="button" onclick="removeRow('${rowId}')" class="p-2 text-slate-400 hover:text-rose-600 transition-colors">
                        <i class="fa-solid fa-trash"></i>
                    </button>
                </div>
            `;

            container.appendChild(row);
            updateDutyDropdown(row, 'resign');
            updateCounts();
        }

        function removeRow(rowId) {
            const row = document.getElementById(rowId);
            if (row) {
                row.remove();
                updateCounts();
            }
        }

        function updateCounts() {
            document.getElementById('totalLeaveCount').innerText = document.querySelectorAll('.leave-row').length;
            document.getElementById('totalResignCount').innerText = document.querySelectorAll('.resign-row').length;
        }

        function openSummaryModal() {
            const dept = document.getElementById('department').value;
            let lineVal = '-';
            const lineSelect = document.getElementById('lineSelect');
            const lineInput = document.getElementById('lineInput');

            if (lineSelect) lineVal = lineSelect.value;
            else if (lineInput) lineVal = lineInput.value;

            const leaveData = [];
            document.querySelectorAll('.leave-row').forEach(row => {
                const id = row.querySelector('[name="leaveEmpId"]').value;
                const name = row.querySelector('[name="leaveName"]').value;
                const type = row.querySelector('[name="leaveType"]').value;
                const dutyEl = row.querySelector('[name="leaveDuty"]');
                const duty = dutyEl ? dutyEl.value : '-';
                if(id) leaveData.push({ id, name, duty, type });
            });

            const resignData = [];
            document.querySelectorAll('.resign-row').forEach(row => {
                const id = row.querySelector('[name="resignEmpId"]').value;
                const name = row.querySelector('[name="resignName"]').value;
                const type = row.querySelector('[name="resignType"]').value;
                const dutyEl = row.querySelector('[name="resignDuty"]');
                const duty = dutyEl ? dutyEl.value : '-';
                if(id) resignData.push({ id, name, duty, type });
            });

            const summaryHTML = `
                <div class="bg-slate-50 p-4 rounded-xl border border-slate-200 space-y-2">
                    <div class="grid grid-cols-2 gap-2 text-xs">
                        <div><span class="text-slate-500">ผู้บันทึก:</span> <strong class="text-slate-900">${document.getElementById('recorderName').value}</strong></div>
                        <div><span class="text-slate-500">วันที่:</span> <strong class="text-slate-900">${document.getElementById('reportDate').value}</strong></div>
                        <div><span class="text-slate-500">แผนก:</span> <strong class="text-slate-900">${dept}</strong></div>
                        <div><span class="text-slate-500">Maker:</span> <strong class="text-slate-900">${document.getElementById('maker').value}</strong></div>
                        <div><span class="text-slate-500">กะ:</span> <strong class="text-slate-900">${document.getElementById('shift').value}</strong></div>
                        <div><span class="text-slate-500">Line:</span> <strong class="text-sky-600">${lineVal || '-'}</strong></div>
                        <div><span class="text-slate-500">ตัว SET / ขาด SET:</span> <strong class="text-slate-900">${document.getElementById('setTarget').value || 0} / ${document.getElementById('setMissing').value || 0} คน</strong></div>
                    </div>
                </div>

                <div class="space-y-2">
                    <h4 class="font-semibold text-xs text-slate-500 uppercase">พนักงานหยุด-ลา (${leaveData.length} คน)</h4>
                    ${leaveData.length === 0 ? '<p class="text-xs text-slate-400 italic">ไม่มีรายการ</p>' : ''}
                    <div class="space-y-1">
                        ${leaveData.map(item => `
                            <div class="flex justify-between items-center text-xs bg-slate-50 p-2 rounded-lg border border-slate-200">
                                <div><strong>[${item.id}] ${item.name}</strong> ${item.duty !== '-' ? `<span class="text-slate-500">(${item.duty})</span>` : ''}</div>
                                <span class="px-2 py-0.5 rounded text-[10px] bg-sky-100 text-sky-700 font-medium">${item.type}</span>
                            </div>
                        `).join('')}
                    </div>
                </div>

                <div class="space-y-2">
                    <h4 class="font-semibold text-xs text-slate-500 uppercase">พนักงานปลด-ลาออก (${resignData.length} คน)</h4>
                    ${resignData.length === 0 ? '<p class="text-xs text-slate-400 italic">ไม่มีรายการ</p>' : ''}
                    <div class="space-y-1">
                        ${resignData.map(item => `
                            <div class="flex justify-between items-center text-xs bg-slate-50 p-2 rounded-lg border border-slate-200">
                                <div><strong>[${item.id}] ${item.name}</strong> ${item.duty !== '-' ? `<span class="text-slate-500">(${item.duty})</span>` : ''}</div>
                                <span class="px-2 py-0.5 rounded text-[10px] bg-rose-100 text-rose-700 font-medium">${item.type}</span>
                            </div>
                        `).join('')}
                    </div>
                </div>

                ${document.getElementById('remark').value ? `
                    <div class="pt-2">
                        <span class="text-xs text-slate-500 block mb-1">หมายเหตุ:</span>
                        <p class="text-xs bg-slate-50 p-2.5 rounded-lg border border-slate-200 text-slate-700">${document.getElementById('remark').value}</p>
                    </div>
                ` : ''}
            `;

            document.getElementById('summaryContent').innerHTML = summaryHTML;
            document.getElementById('summaryModal').classList.remove('hidden');
        }

        function closeSummaryModal() {
            document.getElementById('summaryModal').classList.add('hidden');
        }

        // ฟังก์ชันแปลงหน้าสรุปผลเป็นรูปภาพดาวน์โหลดลงเครื่อง
        function downloadSummaryImage() {
            const captureArea = document.getElementById('summaryCaptureArea');
            const dateStr = document.getElementById('reportDate').value || 'report';
            
            html2canvas(captureArea, { scale: 2 }).then(canvas => {
                const link = document.createElement('a');
                link.download = `Summary_Report_${dateStr}.png`;
                link.href = canvas.toDataURL('image/png');
                link.click();
            });
        }

        async function confirmSubmit() {
            const btn = document.getElementById('submitBtn');
            btn.disabled = true;
            btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> กำลังบันทึก...`;

            let lineVal = '-';
            const lineSelect = document.getElementById('lineSelect');
            const lineInput = document.getElementById('lineInput');
            if (lineSelect) lineVal = lineSelect.value;
            else if (lineInput) lineVal = lineInput.value;

            const leaveList = [];
            document.querySelectorAll('.leave-row').forEach(row => {
                const id = row.querySelector('[name="leaveEmpId"]').value;
                const name = row.querySelector('[name="leaveName"]').value;
                const type = row.querySelector('[name="leaveType"]').value;
                const dutyEl = row.querySelector('[name="leaveDuty"]');
                if(id) leaveList.push({ id, name, duty: dutyEl ? dutyEl.value : '-', type });
            });

            const resignList = [];
            document.querySelectorAll('.resign-row').forEach(row => {
                const id = row.querySelector('[name="resignEmpId"]').value;
                const name = row.querySelector('[name="resignName"]').value;
                const type = row.querySelector('[name="resignType"]').value;
                const dutyEl = row.querySelector('[name="resignDuty"]');
                if(id) resignList.push({ id, name, duty: dutyEl ? dutyEl.value : '-', type });
            });

            const payload = {
                recorderName: document.getElementById('recorderName').value,
                reportDate: document.getElementById('reportDate').value,
                department: document.getElementById('department').value,
                maker: document.getElementById('maker').value,
                shift: document.getElementById('shift').value,
                line: lineVal,
                setTarget: document.getElementById('setTarget').value || 0,
                setMissing: document.getElementById('setMissing').value || 0,
                leaveList: leaveList,
                resignList: resignList,
                remark: document.getElementById('remark').value
            };

            try {
                await fetch(GOOGLE_SCRIPT_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                alert('✅ บันทึกข้อมูลเข้า Google Sheets เรียบร้อยแล้ว!');
                closeSummaryModal();
                document.getElementById('leaveForm').reset();
                document.getElementById('leaveListContainer').innerHTML = '';
                document.getElementById('resignListContainer').innerHTML = '';
                document.getElementById('lineSelectionContainer').innerHTML = '';
                updateCounts();
                showPage('homePage');
            } catch (err) {
                alert('❌ เกิดข้อผิดพลาดในการส่งข้อมูล: ' + err);
            } finally {
                btn.disabled = false;
                btn.innerHTML = `<i class="fa-solid fa-paper-plane"></i> ยืนยันการส่งข้อมูล`;
            }
        }
    </script>
</body>
</html>
